<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Club — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:        #080c14;
            --surface:   #0d1424;
            --card:      #111827;
            --border:    #1e2a3a;
            --border2:   #263042;
            --text:      #e2e8f0;
            --muted:     #4b5e78;
            --dim:       #8899aa;
            --green:     #22c55e;
            --green-dim: #16a34a;
            --green-bg:  rgba(34,197,94,0.08);
            --green-bdr: rgba(34,197,94,0.25);
            --red:       #f87171;
            --red-bg:    rgba(248,113,113,0.08);
            --red-bdr:   rgba(248,113,113,0.25);
            --cyan:      #22d3ee;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 36px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--green-bg), rgba(34,211,238,0.08));
            border: 1px solid var(--green-bdr);
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 24px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }
        .login-sub {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field select,
        .field input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .field select:focus,
        .field input:focus {
            border-color: var(--green);
        }
        .field select option {
            background: #000;
            color: var(--text);
            font-weight: 700;
            padding: 8px;
        }
        .field input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--green);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-login:hover:not(:disabled) {
            opacity: 0.9;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.25);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-box {
            display: none;
            background: var(--red-bg);
            border: 1px solid var(--red-bdr);
            color: var(--red);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .site-info {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .site-info p {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.8;
        }
        .site-info span {
            color: var(--dim);
            font-weight: 600;
        }
        .btn-clear {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }
        .btn-clear:hover:not(:disabled) {
            border-color: var(--red);
            color: var(--red);
        }
        .btn-clear:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .login-box { padding: 24px 18px; border-radius: 12px; }
            .login-title { font-size: 19px; }
            .login-logo { width: 44px; height: 44px; font-size: 20px; }
            .field input, .field select { padding: 10px 12px; font-size: 14px; }
            .btn-login { padding: 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">🎰</div>
            <div class="login-title">Fight Club</div>
            <div class="login-sub">Nucleus Gaming Baccarat — PoC Dashboard</div>
        </div>

        <div id="errorBox" class="error-box"></div>

        <form id="loginForm">
            <div class="field">
                <label>Casino Site</label>
                <select id="siteSelect">
                    {% for key, site in sites.items() %}
                    <option value="{{ key }}" data-waf="{{ 'true' if site.get('waf') else 'false' }}">{{ site.name }}{% if site.get('waf') %} (Cookie){% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="credFields">
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username" autocomplete="username">
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password">
                </div>
            </div>

            <div id="cookieField" style="display:none;">
                <div class="field">
                    <label>Cookies <span style="color:var(--dim);font-weight:400;text-transform:none">(DevTools → Application → Cookies → copy all)</span></label>
                    <textarea id="cookieInput" placeholder="Paste cookies from browser DevTools..." style="width:100%;min-height:70px;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--text);font-family:monospace;font-size:12px;resize:vertical;outline:none;"></textarea>
                </div>
            </div>

            <div id="wafNotice" style="display:none;background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.25);color:#eab308;padding:10px;border-radius:8px;margin-bottom:12px;font-size:11px;">
                ⚠️ This site has WAF protection. Login in browser → open DevTools (F12) → Application → Cookies → copy cookie string and paste above.
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Login & Launch
            </button>
        </form>

        <button class="btn-clear" id="btnClear" onclick="clearCache()">
            🗑 Clear All Cache & Data
        </button>

        <div class="site-info">
            <p>
                {% for key, site in sites.items() %}
                <span>{{ site.name }}</span>{% if not loop.last %} · {% endif %}
                {% endfor %}
            </p>
        </div>
    </div>

    <script>
        const siteSelect = document.getElementById('siteSelect');
        const credFields = document.getElementById('credFields');
        const cookieField = document.getElementById('cookieField');
        const wafNotice = document.getElementById('wafNotice');

        function updateFields() {
            const opt = siteSelect.options[siteSelect.selectedIndex];
            const isWaf = opt.dataset.waf === 'true';
            credFields.style.display = isWaf ? 'none' : '';
            cookieField.style.display = isWaf ? '' : 'none';
            wafNotice.style.display = isWaf ? '' : 'none';
        }
        siteSelect.addEventListener('change', updateFields);
        updateFields();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorBox = document.getElementById('errorBox');
            const site = siteSelect.value;
            const opt = siteSelect.options[siteSelect.selectedIndex];
            const isWaf = opt.dataset.waf === 'true';

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const cookies = document.getElementById('cookieInput').value.trim();

            if (!isWaf && (!username || !password)) {
                errorBox.textContent = 'Enter username and password.';
                errorBox.style.display = 'block';
                return;
            }
            if (isWaf && !cookies) {
                errorBox.textContent = 'Paste cookies from browser DevTools.';
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({site, username, password, cookies})
                });
                const data = await resp.json();

                if (data.success) {
                    btn.innerHTML = '✓ Connected — Balance: ₹' + data.balance.toFixed(2);
                    btn.style.background = '#16a34a';
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    errorBox.textContent = data.message || 'Login failed';
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = 'Login & Launch';
                }
            } catch (err) {
                errorBox.textContent = 'Network error: ' + err.message;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Login & Launch';
            }
        });

        async function clearCache() {
            const btn = document.getElementById('btnClear');
            btn.disabled = true;
            btn.textContent = '⚡ Nuking everything...';
            try {
                // 1. Wipe server-side state
                await fetch('/api/clear-cache', {method: 'POST'});
                // 2. Wipe browser-side storage
                try { localStorage.clear(); } catch(e) {}
                try { sessionStorage.clear(); } catch(e) {}
                // 3. Wipe all browser cookies
                document.cookie.split(';').forEach(c => {
                    document.cookie = c.trim().split('=')[0] + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                });
                btn.textContent = '✓ Wiped! Reloading...';
                btn.style.borderColor = '#22c55e';
                btn.style.color = '#22c55e';
                // 4. Hard reload (bypass cache)
                setTimeout(() => { window.location.href = '/' + '?t=' + Date.now(); }, 800);
            } catch (e) {
                btn.textContent = 'Error — try again';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
