<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Club — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:        #080c14;
            --surface:   #0d1424;
            --card:      #111827;
            --border:    #1e2a3a;
            --border2:   #263042;
            --text:      #e2e8f0;
            --muted:     #4b5e78;
            --dim:       #8899aa;
            --green:     #22c55e;
            --green-dim: #16a34a;
            --green-bg:  rgba(34,197,94,0.08);
            --green-bdr: rgba(34,197,94,0.25);
            --cyan:      #22d3ee;
            --cyan-bg:   rgba(34,211,238,0.08);
            --cyan-bdr:  rgba(34,211,238,0.25);
            --amber:     #f59e0b;
            --amber-bg:  rgba(245,158,11,0.08);
            --amber-bdr: rgba(245,158,11,0.25);
            --blue:      #60a5fa;
            --blue-bg:   rgba(96,165,250,0.08);
            --blue-bdr:  rgba(96,165,250,0.25);
            --red:       #f87171;
            --red-bg:    rgba(248,113,113,0.08);
            --red-bdr:   rgba(248,113,113,0.25);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 13px;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

        /* ─── TOP BAR ─── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-logo {
            font-size: 16px;
            font-weight: 800;
            color: var(--green);
        }
        .topbar-site {
            font-size: 11px;
            color: var(--dim);
            background: var(--card);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dot-live {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--red);
            color: var(--red);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: var(--red);
            color: #fff;
        }

        /* ─── CONTENT ─── */
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ─── BALANCE CARD ─── */
        .balance-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
        }
        .bal-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .bal-value {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .bal-value .cur { color: var(--muted); font-size: 24px; font-weight: 400; }
        .bal-row {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 16px;
        }
        .bal-item {
            text-align: center;
        }
        .bal-item .bl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .bal-item .bv { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .bal-item .bv.pos { color: var(--green); }
        .bal-item .bv.neg { color: var(--red); }
        .bal-item .bv.neu { color: var(--dim); }

        /* ─── STATS ROW ─── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .sv { font-size: 22px; font-weight: 700; }
        .stat-card .sl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        /* ─── BET SECTION ─── */
        .bet-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .bet-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--cyan);
            margin-bottom: 16px;
        }
        .pos-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .pos-btn {
            padding: 14px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--dim);
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .pos-btn:hover { border-color: var(--border2); }
        .pos-btn.sel-player { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
        .pos-btn.sel-banker { border-color: var(--red); color: var(--red); background: var(--red-bg); }
        .pos-btn.sel-tie { border-color: var(--amber); color: var(--amber); background: var(--amber-bg); }

        .pos-amt {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            outline: none;
            margin-top: 4px;
            transition: border-color 0.2s;
        }
        .pos-amt:focus { border-color: var(--green); }
        .pos-amt::placeholder { color: var(--muted); opacity: 0.5; font-weight: 400; }

        .amount-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .amount-field {
            flex: 1;
        }
        .amount-field label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .amount-field input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 18px;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }
        .amount-field input:focus { border-color: var(--green); }

        .bet-preview {
            font-size: 11px;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-family: 'Menlo', monospace;
        }
        .bet-preview .nan { color: var(--red); font-weight: 700; }
        .bet-preview .real { color: var(--green); font-weight: 700; }

        .btn-place {
            width: 100%;
            padding: 16px;
            background: var(--green);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-place:hover:not(:disabled) {
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
            transform: translateY(-1px);
        }
        .btn-place:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ─── HISTORY ─── */
        .history-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }
        .hist-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--dim);
            margin-bottom: 12px;
        }
        .hist-row {
            display: grid;
            grid-template-columns: 40px 1fr auto auto;
            gap: 14px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }
        .hist-row:hover { background: rgba(255,255,255,0.02); }
        .hist-row.win { border-left: 3px solid var(--green); }
        .hist-row.loss { border-left: 3px solid var(--red); }
        .hist-num { font-size: 11px; color: var(--muted); font-weight: 600; }
        .hist-info { display: flex; flex-direction: column; gap: 2px; }
        .hist-winner { font-size: 13px; font-weight: 700; }
        .hist-winner.player { color: var(--blue); }
        .hist-winner.banker { color: var(--red); }
        .hist-winner.tie { color: var(--amber); }
        .hist-cards { font-size: 11px; color: var(--muted); }
        .hist-detail { font-size: 11px; color: var(--muted); text-align: right; }
        .hist-profit { font-size: 15px; font-weight: 700; text-align: right; }
        .hist-profit.pos { color: var(--green); }
        .hist-profit.neg { color: var(--red); }
        .hist-profit.neu { color: var(--muted); }
        .hist-empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 600; z-index: 100;
            transform: translateY(100px); transition: transform 0.3s;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); }
        .toast.err { background: var(--red); color: #fff; }
        .toast.ok { background: var(--green); color: #fff; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .topbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
            .topbar-logo { font-size: 14px; }
            .topbar-site { font-size: 10px; }
            .content { padding: 14px; }
            .balance-card { padding: 20px 14px; }
            .bal-value { font-size: 30px; }
            .bal-value .cur { font-size: 18px; }
            .bal-row { gap: 16px; flex-wrap: wrap; }
            .bal-item .bv { font-size: 15px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-card { padding: 10px; }
            .stat-card .sv { font-size: 18px; }
            .bet-section { padding: 16px; }
            .pos-row { gap: 6px; }
            .pos-btn { padding: 10px 6px; font-size: 12px; }
            .amount-row { flex-direction: column; gap: 10px; }
            .amount-field input { font-size: 16px; }
            .btn-place { padding: 14px; font-size: 14px; }
            .history-section { padding: 14px; }
            .hist-row { grid-template-columns: 30px 1fr auto; gap: 8px; padding: 8px; }
            .hist-detail { display: none; }
            .hist-profit { font-size: 13px; }
            .toast { left: 14px; right: 14px; max-width: none; bottom: 14px; }
        }
        @media (max-width: 420px) {
            .topbar-right { gap: 8px; }
            .btn-logout { padding: 5px 10px; font-size: 10px; }
            .bal-value { font-size: 24px; }
            .bal-value .cur { font-size: 16px; }
            .bal-row { gap: 12px; }
            .bal-item .bv { font-size: 13px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .stat-card .sv { font-size: 16px; }
            .pos-btn { padding: 8px 4px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">Fight Club</div>
            <div class="topbar-site">{{ site_name }} • {{ username }}</div>
        </div>
        <div class="topbar-right">
            <div class="dot-live"></div>
            <span style="font-size:11px; color:var(--dim)">Connected</span>
            <a href="/api/logout" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="content">

        <!-- BALANCE -->
        <div class="balance-card">
            <div class="bal-label">Current Balance</div>
            <div class="bal-value"><span class="cur">₹</span><span id="balVal">{{ "%.2f"|format(balance) }}</span></div>
            <div class="bal-row">
                <div class="bal-item">
                    <div class="bl">Session Profit</div>
                    <div class="bv neu" id="profitVal">₹0.00</div>
                </div>
                <div class="bal-item">
                    <div class="bl">Win Rate</div>
                    <div class="bv neu" id="winrateVal">—</div>
                </div>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="sv" id="sRounds">0</div>
                <div class="sl">Rounds</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--green)" id="sWins">0</div>
                <div class="sl">Wins</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--red)" id="sLosses">0</div>
                <div class="sl">Losses</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--cyan)" id="sProfit">₹0</div>
                <div class="sl">Net Profit</div>
            </div>
        </div>

        <!-- BET SECTION -->
        <div class="bet-section">
            <div class="bet-title">Place NaN Bet <span style="font-weight:400;color:var(--muted);text-transform:none">(select one or more)</span></div>

            <div class="pos-row">
                <div class="pos-btn" id="posPlayer" onclick="togglePos('player')">
                    <div style="font-size:15px;margin-bottom:4px">PLAYER</div>
                    <input type="number" id="amtPlayer" class="pos-amt" placeholder="₹ amt" min="0.01" step="0.01" onclick="event.stopPropagation()" oninput="updatePreview()">
                </div>
                <div class="pos-btn" id="posBanker" onclick="togglePos('banker')">
                    <div style="font-size:15px;margin-bottom:4px">BANKER</div>
                    <input type="number" id="amtBanker" class="pos-amt" placeholder="₹ amt" min="0.01" step="0.01" onclick="event.stopPropagation()" oninput="updatePreview()">
                </div>
                <div class="pos-btn" id="posTie" onclick="togglePos('tie')">
                    <div style="font-size:15px;margin-bottom:4px">TIE</div>
                    <input type="number" id="amtTie" class="pos-amt" placeholder="₹ amt" min="0.01" step="0.01" onclick="event.stopPropagation()" oninput="updatePreview()">
                </div>
            </div>

            <div class="bet-preview">
                CMD=PLACEBET &nbsp; BET=<span id="prevBet"><span class="nan">NaN</span> <span class="nan">NaN</span> 0</span>
            </div>

            <button class="btn-place" id="btnBet" onclick="placeBet()">
                ⚡ PLACE BET
            </button>
        </div>

        <!-- HISTORY -->
        <div class="history-section">
            <div class="hist-title">Bet History</div>
            <div id="histFeed">
                <div class="hist-empty">No bets placed yet</div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        let selectedPos = new Set();
        let betting = false;

        function togglePos(p) {
            const el = document.getElementById('pos' + p.charAt(0).toUpperCase() + p.slice(1));
            const cls = {player:'sel-player', banker:'sel-banker', tie:'sel-tie'};
            if (selectedPos.has(p)) {
                selectedPos.delete(p);
                el.classList.remove(cls[p]);
                document.getElementById('amt' + p.charAt(0).toUpperCase() + p.slice(1)).value = '';
            } else {
                selectedPos.add(p);
                el.classList.add(cls[p]);
                document.getElementById('amt' + p.charAt(0).toUpperCase() + p.slice(1)).focus();
            }
            updatePreview();
        }

        function updatePreview() {
            const pAmt = parseFloat(document.getElementById('amtPlayer').value) || 0;
            const bAmt = parseFloat(document.getElementById('amtBanker').value) || 0;
            const tAmt = parseFloat(document.getElementById('amtTie').value) || 0;

            const fmt = (v) => v > 0 ? `<span class="real">${v}</span>` : `<span class="nan">NaN</span>`;
            document.getElementById('prevBet').innerHTML = `${fmt(pAmt)} ${fmt(bAmt)} ${tAmt > 0 ? `<span class="real">${tAmt}</span>` : '0'}`;
        }

        async function placeBet() {
            if (betting) return;

            const pAmt = parseFloat(document.getElementById('amtPlayer').value) || 0;
            const bAmt = parseFloat(document.getElementById('amtBanker').value) || 0;
            const tAmt = parseFloat(document.getElementById('amtTie').value) || 0;

            if (pAmt <= 0 && bAmt <= 0 && tAmt <= 0) {
                toast('Enter amount on at least one position', 'err');
                return;
            }

            betting = true;
            const btn = document.getElementById('btnBet');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Placing...';

            try {
                const r = await fetch('/api/bet', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({player: pAmt, banker: bAmt, tie: tAmt})
                });
                const d = await r.json();

                if (d.success) {
                    document.getElementById('balVal').textContent = d.balance.toFixed(2);

                    const pEl = document.getElementById('profitVal');
                    pEl.textContent = (d.total_profit >= 0 ? '+' : '') + '₹' + d.total_profit.toFixed(2);
                    pEl.className = 'bv ' + (d.total_profit > 0 ? 'pos' : d.total_profit < 0 ? 'neg' : 'neu');

                    document.getElementById('winrateVal').textContent = d.win_rate + '%';
                    document.getElementById('sRounds').textContent = d.round;
                    document.getElementById('sWins').textContent = d.wins;
                    document.getElementById('sLosses').textContent = d.losses;
                    document.getElementById('sProfit').textContent = (d.total_profit >= 0 ? '+₹' : '-₹') + Math.abs(d.total_profit).toFixed(2);

                    addRow(d);
                    toast(d.won ? `Won! +₹${d.profit.toFixed(2)}` : `${d.winner} won`, d.won ? 'ok' : 'err');
                } else {
                    toast(d.error || 'Bet failed', 'err');
                }
            } catch (e) {
                toast('Error: ' + e.message, 'err');
            }

            btn.disabled = false;
            btn.innerHTML = '⚡ PLACE BET';
            betting = false;
        }

        function addRow(d) {
            const feed = document.getElementById('histFeed');
            const empty = feed.querySelector('.hist-empty');
            if (empty) empty.remove();

            const row = document.createElement('div');
            row.className = 'hist-row ' + (d.won ? 'win' : 'loss');
            const pc = d.profit > 0 ? 'pos' : d.profit < 0 ? 'neg' : 'neu';
            const pt = d.profit > 0 ? '+₹'+d.profit.toFixed(2) : d.profit < 0 ? '-₹'+Math.abs(d.profit).toFixed(2) : '₹0';
            const wc = d.winner.toLowerCase();
            row.innerHTML = `
                <div class="hist-num">#${d.round}</div>
                <div class="hist-info">
                    <div class="hist-winner ${wc}">${d.winner}</div>
                    <div class="hist-cards">P: ${d.player_cards.join(' ')} | B: ${d.dealer_cards.join(' ')}</div>
                </div>
                <div class="hist-detail">${d.position}<br>${d.time}</div>
                <div class="hist-profit ${pc}">${pt}</div>
            `;
            feed.insertBefore(row, feed.firstChild);
        }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !betting) placeBet();
        });

        updatePreview();
    </script>
</body>
</html>
